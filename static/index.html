<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STUDYX — Academic Materials</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 900px; margin: 0 auto; }
        h1 {
            text-align: center;
            color: #38bdf8;
            margin-bottom: 8px;
        }
        .subtitle {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 24px;
            font-size: 14px;
        }
        .search-box {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #334155;
            border-radius: 8px;
            background: #1e293b;
            color: #e2e8f0;
            font-size: 16px;
            margin-bottom: 20px;
        }
        .search-box:focus {
            outline: none;
            border-color: #38bdf8;
        }
        .modules-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 16px;
            margin-bottom: 32px;
        }
        .module-card {
            background: #1e293b;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #334155;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .module-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(56, 189, 248, 0.15);
        }
        .module-card h3 {
            color: #38bdf8;
            font-size: 16px;
            margin-bottom: 6px;
        }
        .module-card .desc {
            color: #94a3b8;
            font-size: 13px;
            margin-bottom: 8px;
            line-height: 1.4;
        }
        .module-card .count {
            color: #64748b;
            font-size: 13px;
        }
        .materials-section {
            background: #1e293b;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #334155;
            margin-bottom: 24px;
        }
        .materials-section h2 {
            color: #38bdf8;
            font-size: 18px;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #334155;
        }
        .material-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #334155;
        }
        .material-item:last-child { border-bottom: none; }
        .material-item .info h4 {
            color: #e2e8f0;
            font-size: 14px;
            margin-bottom: 2px;
        }
        .material-item .info .meta {
            color: #64748b;
            font-size: 12px;
        }
        .material-item .download-link {
            color: #38bdf8;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            padding: 6px 12px;
            border: 1px solid #38bdf8;
            border-radius: 6px;
            transition: background 0.2s;
        }
        .material-item .download-link:hover {
            background: rgba(56, 189, 248, 0.1);
        }
        .error-msg {
            text-align: center;
            color: #ef4444;
            padding: 20px;
        }
        .loading {
            text-align: center;
            color: #64748b;
            padding: 20px;
        }
        .search-results .result-item {
            padding: 10px 0;
            border-bottom: 1px solid #334155;
        }
        .search-results .result-item:last-child { border-bottom: none; }
        .search-results .module-tag {
            display: inline-block;
            background: #0ea5e9;
            color: white;
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 4px;
            margin-left: 8px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🎓 STUDYX — Academic Materials</h1>
    <p class="subtitle">FLSH Mohammedia — Semester 5 • Group 2</p>

    <input type="text" class="search-box" id="searchBox" placeholder="🔍 Search materials across all modules..." autocomplete="off">

    <div id="modulesGrid" class="modules-grid">
        <div class="loading">Loading modules...</div>
    </div>

    <div id="searchResults" style="display:none;" class="search-results">
        <h2>Search Results</h2>
        <div id="resultsContent"></div>
    </div>

    <div id="materialsView"></div>
</div>

<script>
const API_BASE = '/api';

async function fetchAPI(endpoint) {
    const resp = await fetch(API_BASE + endpoint);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    return resp.json();
}

async function loadModules() {
    const grid = document.getElementById('modulesGrid');
    try {
        const data = await fetchAPI('/modules');
        if (data.modules.length === 0) {
            grid.innerHTML = '<div class="loading">No modules found.</div>';
            return;
        }
        grid.innerHTML = data.modules.map(m => `
            <div class="module-card" onclick="loadMaterials('${encodeURIComponent(m.name)}', this)">
                <h3>${m.name}</h3>
                <div class="desc">${m.description || 'No description available.'}</div>
                <div class="count">${m.material_count} material(s)</div>
            </div>
        `).join('');
    } catch (err) {
        grid.innerHTML = `<div class="error-msg">Error loading modules: ${err.message}</div>`;
    }
}

async function loadMaterials(moduleName, clickedCard) {
    // Highlight active card
    document.querySelectorAll('.module-card').forEach(c => c.classList.remove('active'));
    if (clickedCard) clickedCard.classList.add('active');

    const view = document.getElementById('materialsView');
    view.innerHTML = '<div class="loading">Loading materials...</div>';
    document.getElementById('searchResults').style.display = 'none';

    try {
        const data = await fetchAPI(`/materials/${encodeURIComponent(moduleName)}`);
        if (data.materials.length === 0) {
            view.innerHTML = `
                <div class="materials-section">
                    <h2>${moduleName}</h2>
                    <div class="loading">No materials uploaded yet.</div>
                </div>
            `;
            return;
        }

        const fileIcons = {
            'application/pdf': '📄',
            'application/vnd.openxmlformats-officedocument.wordprocessingml.document': '📝',
            'text/plain': '📝',
            'text/markdown': '📝',
            'image/jpeg': '🖼️',
            'image/png': '🖼️',
            'image/webp': '🖼️',
        };

        view.innerHTML = `
            <div class="materials-section">
                <h2>${moduleName}</h2>
                ${data.materials.map(m => `
                    <div class="material-item">
                        <div class="info">
                            <h4>${fileIcons[m.mime_type] || '📎'} ${m.title}</h4>
                            <div class="meta">
                                ${m.file_size ? (m.file_size / 1024).toFixed(1) + ' KB' : 'Unknown size'}
                                • ${new Date(m.uploaded_at).toLocaleDateString()}
                            </div>
                        </div>
                        <a href="${m.download_url}" class="download-link" download>⬇️ Download</a>
                    </div>
                `).join('')}
            </div>
        `;
    } catch (err) {
        view.innerHTML = `<div class="error-msg">Error loading materials: ${err.message}</div>`;
    }
}

// Live search
let searchTimeout;
document.getElementById('searchBox').addEventListener('input', async (e) => {
    const q = e.target.value.trim();
    if (!q) {
        document.getElementById('searchResults').style.display = 'none';
        document.getElementById('modulesGrid').style.display = 'grid';
        return;
    }
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(async () => {
        try {
            const data = await fetchAPI(`/search?q=${encodeURIComponent(q)}`);
            const resultsDiv = document.getElementById('searchResults');
            const contentDiv = document.getElementById('resultsContent');
            document.getElementById('modulesGrid').style.display = 'none';
            resultsDiv.style.display = 'block';
            if (data.results.length === 0) {
                contentDiv.innerHTML = '<div class="loading">No results found.</div>';
            } else {
                contentDiv.innerHTML = data.results.map(r => `
                    <div class="result-item">
                        <strong>${r.title}</strong>
                        <span class="module-tag">${r.module}</span>
                        <br><small style="color:#64748b">${r.mime_type}</small>
                    </div>
                `).join('');
            }
        } catch (err) {
            document.getElementById('resultsContent').innerHTML =
                `<div class="error-msg">Search error: ${err.message}</div>`;
        }
    }, 400);
});

loadModules();
</script>
</body>
</html>
