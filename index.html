<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STUDYX — Academic Materials</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        /* ===== Design System Tokens (from DESIGN.md) ===== */
        :root {
            --color-bg: #0a0f1a;
            --color-surface: #111827;
            --color-surface-hover: #172032;
            --color-border: #1e293b;
            --color-border-hover: #334159;
            --color-primary: #0ea5e9;
            --color-primary-glow: rgba(14, 165, 233, 0.2);
            --color-primary-hover: #0284c7;
            --color-text: #f1f5f9;
            --color-text-muted: #94a3b8;
            --color-text-dim: #64748b;
            --color-accent-green: #10b981;
            --color-accent-amber: #f59e0b;
            --color-accent-red: #ef4444;

            --font-display: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --font-mono: 'JetBrains Mono', 'Fira Code', monospace;

            --radius-lg: 16px;
            --radius-md: 12px;
            --radius-sm: 8px;

            --gap-sm: 8px;
            --gap-md: 16px;
            --gap-lg: 24px;

            --ease-out-quad: cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --ease-in-out-sine: cubic-bezier(0.37, 0, 0.63, 1);
            --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);

            --max-width: 960px;
            --gutter: 24px;

            --transition-instant: 80ms;
            --transition-quick: 180ms;
            --transition-standard: 280ms;
            --transition-slow: 520ms;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-display);
            background: var(--color-bg);
            color: var(--color-text);
            min-height: 100vh;
            overflow-x: hidden;
            padding: var(--gap-md);
        }

        .container {
            max-width: var(--max-width);
            margin: 0 auto;
        }

        /* ===== Animated Background Particles ===== */
        .bg-canvas {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;
        }

        .bg-particle {
            position: absolute;
            border-radius: 50%;
            background: var(--color-primary);
            opacity: 0.08;
            animation: floatParticle calc(var(--float-duration, 20s)) linear infinite;
        }

        @keyframes floatParticle {
            0% { transform: translateY(0) rotate(0deg) scale(1); opacity: 0; }
            10% { opacity: 0.1; }
            90% { opacity: 0.06; }
            100% { transform: translateY(-100vh) rotate(360deg) scale(1.2); opacity: 0; }
        }

        /* ===== Header with Fluid Motion ===== */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: var(--gap-lg);
            padding: var(--gap-md) 0;
            opacity: 0;
            animation: slideDown 0.6s var(--ease-out-quad) forwards;
        }

        @keyframes slideDown {
            to { opacity: 1; transform: translateY(0); }
        }

        .logo {
            display: flex;
            align-items: center;
            gap: var(--gap-sm);
            font-size: 28px;
            font-weight: 700;
            color: var(--color-text);
            text-decoration: none;
        }

        .logo .accent { color: var(--color-primary); }
        .logo .icon {
            width: 36px; height: 36px;
            background: linear-gradient(135deg, var(--color-primary), #38bdf8);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            animation: pulseGlow 2s ease-in-out infinite;
        }

        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 16px rgba(14, 165, 233, 0.3); }
            50% { box-shadow: 0 0 24px rgba(14, 165, 233, 0.5); }
        }

        .subtitle {
            color: var(--color-text-muted);
            font-size: 14px;
            font-weight: 300;
        }

        /* ===== Search Bar ===== */
        .search-bar {
            position: relative;
            margin-bottom: var(--gap-lg);
            opacity: 0;
            animation: slideUp 0.5s var(--ease-out-quad) 0.1s forwards;
        }

        @keyframes slideUp {
            to { opacity: 1; transform: translateY(0); }
        }

        .search-bar { animation-fill-name: slideUp; }

        .search-input-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-icon {
            position: absolute;
            left: 16px;
            color: var(--color-text-dim);
            font-size: 18px;
            transition: color var(--transition-instant) var(--ease-out-quad);
            z-index: 1;
            pointer-events: none;
        }

        .search-input {
            width: 100%;
            height: 56px;
            padding: 0 20px 0 48px;
            background: rgba(17, 24, 43, 0.85);
            border: 1.5px solid var(--color-border);
            border-radius: var(--radius-lg);
            font-family: var(--font-display);
            font-size: 16px;
            color: var(--color-text);
            outline: none;
            backdrop-filter: blur(12px);
            transition: 
                border-color var(--transition-standard) var(--ease-in-out-sine),
                background-color var(--transition-standard) var(--ease-in-out-sine),
                box-shadow var(--transition-standard) var(--ease-in-out-sine);
        }

        .search-input:focus {
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px var(--color-primary-glow);
        }

        .search-input:focus + .search-icon,
        .search-input:not(:placeholder-shown) + .search-icon {
            color: var(--color-primary);
        }

        /* ===== Modules Grid ===== */
        .modules-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: var(--gap-md);
            margin-bottom: var(--gap-lg);
        }

        .module-card {
            background: rgba(17, 24, 43, 0.85);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            padding: 24px;
            cursor: pointer;
            backdrop-filter: blur(12px);
            transition: 
                transform var(--transition-instant) var(--ease-out-quad),
                border-color var(--transition-instant) var(--ease-out-quad),
                box-shadow var(--transition-instant) var(--ease-out-quad),
                background-color var(--transition-standard) var(--ease-in-out-sine);
            opacity: 0;
            transform: translateY(20px) scale(0.97);
            position: relative;
            overflow: hidden;
        }

        .module-card:hover {
            transform: translateY(-4px) scale(1);
            border-color: var(--color-primary);
            box-shadow: 0 12px 40px var(--color-primary-glow);
        }

        .module-card::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90, transparent, rgba(14, 165, 233, 0.08), transparent);
            transition: left var(--transition-standard) var(--ease-spring);
        }

        .module-card:hover::before {
            left: 100%;
        }

        .module-icon {
            width: 48px; height: 48px;
            border-radius: var(--radius-md);
            background: linear-gradient(135deg, var(--color-primary-glow), var(--color-primary));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin-bottom: var(--gap-sm);
            transition: transform var(--transition-instant) var(--ease-out-quad);
        }

        .module-card:hover .module-icon {
            transform: scale(1.1);
        }

        .module-name {
            font-size: 18px;
            font-weight: 600;
            color: var(--color-text);
            margin-bottom: 4px;
        }

        .module-desc {
            font-size: 13px;
            color: var(--color-text-muted);
            line-height: 1.4;
        }

        .module-stats {
            display: flex;
            align-items: center;
            gap: var(--gap-sm);
            margin-top: 12px;
            font-size: 12px;
            color: var(--color-text-dim);
        }

        .stat-dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--color-text-dim);
        }

        /* ===== Loading Skeleton ===== */
        .skeleton {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: var(--gap-md);
        }

        .skeleton-card {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            padding: 24px;
            height: 140px;
            position: relative;
            overflow: hidden;
        }

        .skeleton-card::after {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90, transparent, rgba(255,255,255,0.03), transparent);
            animation: shimmer 1.8s infinite;
        }

        @keyframes shimmer {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        /* ===== Materials View ===== */
        .materials-view {
            display: none;
            opacity: 0;
            transform: translateX(-20px) scale(0.98);
            transition: 
                opacity var(--transition-standard) var(--ease-in-out-sine),
                transform var(--transition-standard) var(--ease-in-out-sine);
        }

        .materials-view.active {
            display: block;
            opacity: 1;
            transform: translateX(0) scale(1);
        }

        .materials-view-enter {
            animation: slideInFromRight 0.5s var(--ease-out-quad) forwards;
        }

        @keyframes slideInFromRight {
            from { opacity: 0; transform: translateX(20px) scale(0.98); }
            to { opacity: 1; transform: translateX(0) scale(1); }
        }

        .back-btn {
            display: flex;
            align-items: center;
            gap: var(--gap-sm);
            background: rgba(255,255,255,0.03);
            color: var(--color-text-muted);
            border: 1.5px solid var(--color-border);
            border-radius: var(--radius-md);
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: 
                background-color var(--transition-instant) var(--ease-out-quad),
                color var(--transition-instant) var(--ease-out-quad),
                border-color var(--transition-instant) var(--ease-out-quad),
                transform var(--transition-instant) var(--ease-spring);
            margin-bottom: var(--gap-md);
            backdrop-filter: blur(12px);
        }

        .back-btn:hover {
            transform: scale(0.97);
            background: var(--color-surface-hover);
            border-color: var(--color-border-hover);
            color: var(--color-text);
        }

        .back-btn .arrow {
            transition: transform var(--transition-instant) var(--ease-spring);
        }

        .back-btn:hover .arrow {
            transform: translateX(-2px);
        }

        .module-header h2 {
            font-size: 24px;
            font-weight: 700;
            color: var(--color-text);
            margin-bottom: 4px;
        }

        .module-header .meta {
            display: flex;
            align-items: center;
            gap: var(--gap-sm);
            font-size: 13px;
            color: var(--color-text-muted);
            margin-bottom: var(--gap-md);
        }

        .material-count-badge {
            background: var(--color-primary-glow);
            border: 1px solid var(--color-primary);
            color: var(--color-primary);
            padding: 4px 12px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
        }

        /* ===== Material Items ===== */
        .materials-list {
            display: flex;
            flex-direction: column;
            gap: var(--gap-sm);
        }

        .material-item {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: var(--gap-md);
            transition: 
                background-color var(--transition-standard) var(--ease-in-out-sine),
                border-color var(--transition-standard) var(--ease-in-out-sine),
                transform var(--transition-instant) var(--ease-spring);
            opacity: 0;
            transform: translateY(10px) scale(0.98);
        }

        .material-item:hover {
            transform: scale(1);
            border-color: var(--color-border-hover);
        }

        .material-left {
            display: flex;
            align-items: center;
            gap: var(--gap-md);
            flex: 1;
        }

        .file-icon {
            width: 40px; height: 40px;
            border-radius: var(--radius-sm);
            background: linear-gradient(135deg, var(--color-primary-glow), var(--color-primary));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .material-info h4 {
            font-size: 14px;
            font-weight: 600;
            color: var(--color-text);
            margin-bottom: 2px;
        }

        .material-info .meta-row {
            display: flex;
            align-items: center;
            gap: var(--gap-sm);
            font-size: 12px;
            color: var(--color-text-muted);
        }

        .material-info .meta-row .dot {
            width: 3px; height: 3px;
            border-radius: 50%;
            background: var(--color-text-dim);
        }

        .download-btn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: var(--color-primary);
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: 
                background-color var(--transition-instant) var(--ease-out-quad),
                transform var(--transition-instant) var(--ease-spring),
                box-shadow var(--transition-instant) var(--ease-out-quad);
        }

        .download-btn:hover {
            background: var(--color-primary-hover);
            transform: scale(0.97);
            box-shadow: 0 0 16px var(--color-primary-glow);
        }

        .download-btn:active {
            transform: scale(0.94);
        }

        /* ===== Empty State ===== */
        .empty-state {
            text-align: center;
            padding: 48px var(--gap-md);
            color: var(--color-text-muted);
        }

        .empty-state .icon {
            font-size: 48px;
            opacity: 0.3;
            margin-bottom: var(--gap-sm);
        }

        .empty-state p {
            font-size: 14px;
            font-weight: 300;
        }

        /* ===== Footer ===== */
        .footer {
            text-align: center;
            color: var(--color-text-dim);
            font-size: 12px;
            margin-top: var(--gap-lg);
            padding-top: var(--gap-md);
            border-top: 1px solid var(--color-border);
        }

        /* ===== Responsive ===== */
        @media (max-width: 640px) {
            body { padding: 12px; }
            .header { flex-direction: column; gap: 8px; }
            .container { width: 100%; }
            .module-card { padding: 20px; }
            .search-input { height: 48px; font-size: 14px; }
            .material-item { padding: 12px; }
        }
    </style>
</head>
<body>
    <!-- Animated Background -->
    <div class="bg-canvas" id="bgCanvas"></div>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <a href="#" class="logo">
                <span class="icon">🎓</span>
                <span>STU<span class="accent">DYX</span></span>
            </a>
            <p class="subtitle">Academic Materials Portal — FLSH Mohammedia S5-G2</p>
        </div>

        <!-- Search -->
        <div class="search-bar">
            <div class="search-input-wrap">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchBox" class="search-input" placeholder="Search materials across all modules..." autocomplete="off">
            </div>
        </div>

        <!-- Modules Grid -->
        <div id="modulesGrid" class="modules-grid">
            <div class="skeleton" id="skeletonGrid">
                <div class="skeleton-card" style="animation-delay: 0ms"></div>
                <div class="skeleton-card" style="animation-delay: 100ms"></div>
                <div class="skeleton-card" style="animation-delay: 200ms"></div>
            </div>
        </div>

        <!-- Search Results -->
        <div id="searchResults" class="materials-view">
            <button class="back-btn" onclick="backToModules()">
                <span class="arrow">←</span> Back to Modules
            </button>
            <h2 style="font-size:20px; font-weight:700; color:var(--color-text); margin-bottom:var(--gap-md);">Search Results</h2>
            <div id="resultsContent"></div>
        </div>

        <!-- Materials View -->
        <div id="materialsView" class="materials-view"></div>

        <!-- Footer -->
        <div class="footer">
            <p>STUDYX Bot • GitHub: kaine28rin-eng/Studex33io-web</p>
        </div>
    </div>

    <script>
        const API_BASE = '/api';

        /* ===== Detect Environment ===== */
        function isGitHubPages() {
            return window.location.hostname.includes('github.io');
        }

        /* ===== Animated Background Particles ===== */
        function initBackground() {
            const canvas = document.getElementById('bgCanvas');
            const count = 15;
            for (let i = 0; i < count; i++) {
                const p = document.createElement('div');
                p.className = 'bg-particle';
                const size = Math.random() * 3 + 1;
                p.style.width = `${size}px`;
                p.style.height = `${size}px`;
                p.style.left = `${Math.random() * 100}%`;
                p.style.top = `${Math.random() * 100}%`;
                p.style.animationDelay = `-${Math.random() * 20}s`;
                p.style.setProperty('--float-duration', `${15 + Math.random() * 15}s`);
                canvas.appendChild(p);
            }
        }

        /* ===== Module Icon Mapping ===== */
        const moduleIcons = {
            '19th Century Literature': '📚',
            'Applied Linguistics': '🔤',
            'Cultural Studies': '🎬',
            'Introduction to Linguistics': '🔍',
            'Introduction to Research': '🔬',
            'Discourse Analysis': '💬',
            'French & Translation': '🗣️',
            'Advanced Research Techniques': '🎯',
            'General Linguistics': '🔣'
        };

        /* ===== Format File Size ===== */
        function formatFileSize(bytes) {
            if (!bytes || bytes === 0) return '—';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
        }

        /* ===== Load Modules ===== */
        async function loadModules() {
            const grid = document.getElementById('modulesGrid');
            try {
                let modules;
                if (isGitHubPages()) {
                    const resp = await fetch('api/materials.json');
                    const data = await resp.json();
                    modules = data.modules || [];
                } else {
                    const resp = await fetch(`${API_BASE}/modules`);
                    const data = await resp.json();
                    modules = data.modules || [];
                }

                if (modules.length === 0) {
                    grid.innerHTML = '<div class="empty-state"><div class="icon">📭</div><p>No modules found.</p></div>';
                    return;
                }

                // Hide skeleton, show modules
                setTimeout(() => {
                    grid.innerHTML = modules.map((m, i) => `
                        <div class="module-card" onclick="showModule('${m.name}')" style="animation-delay: ${i * 50}ms">
                            <div class="module-icon">${moduleIcons[m.name] || '📄'}</div>
                            <h3 class="module-name">${m.name}</h3>
                            <p class="module-desc">${m.description || ''}</p>
                            <div class="module-stats">
                                <span class="stat-dot"></span>
                                <span>${m.material_count || 0} material${m.material_count !== 1 ? 's' : ''}</span>
                            </div>
                        </div>
                    `).join('');

                    // Stagger animation: fade in each card
                    const cards = grid.querySelectorAll('.module-card');
                    cards.forEach(card => {
                        card.style.opacity = '1';
                    });
                }, 300);

            } catch (e) {
                grid.innerHTML = '<div class="empty-state"><div class="icon">⚠️</div><p>Error loading modules.</p></div>';
                console.error(e);
            }
        }

        /* ===== Show Module Materials ===== */
        async function showModule(moduleName) {
            const view = document.getElementById('materialsView');
            const grid = document.getElementById('modulesGrid');
            
            grid.style.opacity = '0';
            grid.style.transform = 'translateY(-10px) scale(0.98)';
            
            setTimeout(async () => {
                grid.style.display = 'none';
                
                view.innerHTML = `
                    <button class="back-btn" onclick="backToModules()">
                        <span class="arrow">←</span> Back to Modules
                    </button>
                    <div class="module-header">
                        <h2>${moduleName}</h2>
                        <div class="meta" id="moduleMeta">
                            <span class="material-count-badge" id="materialCount">0 materials</span>
                            <span class="dot"></span>
                            <span id="moduleDesc"></span>
                        </div>
                    </div>
                    <div class="materials-list" id="materialsList">
                        <div class="material-item" style="opacity:0.5">
                            <div style="text-align:center;padding:20px;width:100%">
                                Loading materials...
                            </div>
                        </div>
                    </div>
                `;
                view.classList.add('active', 'materials-view-enter');
                view.style.display = 'block';

                try {
                    let materials, moduleInfo;
                    if (isGitHubPages()) {
                        const resp = await fetch('api/materials.json');
                        const data = await resp.json();
                        materials = (data.materials || []).filter(m => m.module === moduleName);
                        const mod = (data.modules || []).find(m => m.name === moduleName);
                        moduleInfo = mod || { name: moduleName, description: '', material_count: materials.length };
                    } else {
                        const resp = await fetch(`${API_BASE}/materials/${encodeURIComponent(moduleName)}`);
                        const data = await resp.json();
                        materials = data.materials || [];
                        moduleInfo = { name: moduleName, description: '', material_count: materials.length };
                    }

                    // Update header
                    document.getElementById('materialCount').textContent =
                        `${materials.length} material${materials.length !== 1 ? 's' : ''}`;
                    document.getElementById('moduleDesc').textContent = moduleInfo.description || '';

                    if (materials.length === 0) {
                        document.getElementById('materialsList').innerHTML = `
                            <div class="empty-state">
                                <div class="icon">📭</div>
                                <p>No materials uploaded yet. Check back later!</p>
                            </div>
                        `;
                    } else {
                        // Render materials with stagger
                        let html = '';
                        materials.forEach((m, i) => {
                            html += `
                                <div class="material-item" style="animation-delay: ${i * 50}ms">
                                    <div class="material-left">
                                        <div class="file-icon">${getFileIcon(m.mime_type)}</div>
                                        <div class="material-info">
                                            <h4>${m.title}</h4>
                                            <div class="meta-row">
                                                <span class="dot"></span>
                                                <span>${formatFileSize(m.file_size)}</span>
                                                <span class="dot"></span>
                                                <span>${m.mime_type || 'file'}</span>
                                                ${m.uploaded_at ? `<span class="dot"></span><span>${new Date(m.uploaded_at).toLocaleDateString()}</span>` : ''}
                                            </div>
                                        </div>
                                    </div>
                                    <a href="${m.download_url || '#'}" class="download-btn">
                                        Download
                                    </a>
                                </div>
                            `;
                        });

                        document.getElementById('materialsList').innerHTML = html;
                        
                        // Trigger staggered animation
                        setTimeout(() => {
                            document.querySelectorAll('.material-item').forEach(c => {
                                c.style.opacity = '1';
                                c.style.transform = 'translateY(0) scale(1)';
                            });
                        }, 100);
                    }
                } catch (e) {
                    document.getElementById('materialsList').innerHTML =
                        '<div class="empty-state"><div class="icon">⚠️</div><p>Error loading materials.</p></div>';
                    console.error(e);
                }
            }, 250);
        }

        /* ===== Back to Modules ===== */
        function backToModules() {
            const view = document.getElementById('materialsView');
            const grid = document.getElementById('modulesGrid');
            
            view.classList.remove('active');
            view.style.display = 'none';
            
            grid.style.display = 'grid';
            setTimeout(() => {
                grid.style.opacity = '1';
                grid.style.transform = 'translateY(0) scale(1)';
            }, 50);
        }

        /* ===== File Type Icon ===== */
        function getFileIcon(mimeType) {
            if (!mimeType) return '📄';
            if (mimeType.includes('pdf')) return '📑';
            if (mimeType.includes('image')) return '🖼️';
            if (mimeType.includes('video')) return '🎥';
            if (mimeType.includes('audio')) return '🎵';
            if (mimeType.includes('word') || mimeType.includes('document') || mimeType.includes('text')) return '📝';
            if (mimeType.includes('zip') || mimeType.includes('archive')) return '📦';
            return '📄';
        }

        /* ===== Search Materials ===== */
        async function searchMaterials() {
            const query = document.getElementById('searchBox').value.trim();
            if (!query) {
                document.getElementById('searchResults').classList.remove('active');
                document.getElementById('searchResults').style.display = 'none';
                return;
            }

            document.getElementById('materialsView').style.display = 'none';
            document.getElementById('materialsView').classList.remove('active');

            try {
                let results;
                if (isGitHubPages()) {
                    const resp = await fetch('api/materials.json');
                    const data = await resp.json();
                    const q = query.toLowerCase();
                    results = (data.materials || []).filter(m =>
                        (m.title && m.title.toLowerCase().includes(q)) ||
                        (m.module && m.module.toLowerCase().includes(q)) ||
                        (m.content_text && m.content_text.toLowerCase().includes(q))
                    );
                } else {
                    const resp = await fetch(`${API_BASE}/search?q=${encodeURIComponent(query)}`);
                    const data = await resp.json();
                    results = data.results || [];
                }

                const resultsDiv = document.getElementById('resultsContent');
                const resultsSection = document.getElementById('searchResults');

                if (results.length === 0) {
                    resultsDiv.innerHTML = '<div class="empty-state"><div class="icon">🔍</div><p>No results found for "' + query + '".</p></div>';
                } else {
                    resultsDiv.className = 'materials-list';
                    let html = '';
                    results.forEach((m, i) => {
                        html += `
                            <div class="material-item" style="animation-delay: ${i * 50}ms">
                                <div class="material-left">
                                    <div class="file-icon">${getFileIcon(m.mime_type)}</div>
                                    <div class="material-info">
                                        <h4>${m.title}</h4>
                                        <div class="meta-row">
                                            <span class="dot"></span>
                                            <span>${m.module}</span>
                                            <span class="dot"></span>
                                            <span>${formatFileSize(m.file_size)}</span>
                                        </div>
                                    </div>
                                </div>
                                ${m.download_url ? `<a href="${m.download_url}" class="download-btn">Download</a>` : ''}
                            </div>
                        `;
                    });
                    resultsDiv.innerHTML = html;

                    setTimeout(() => {
                        document.querySelectorAll('#searchResults .material-item').forEach(c => {
                            c.style.opacity = '1';
                            c.style.transform = 'translateY(0) scale(1)';
                        });
                    }, 100);
                }
                resultsSection.style.display = 'block';
                setTimeout(() => resultsSection.classList.add('active'), 10);

            } catch (e) {
                console.error(e);
            }
        }

        /* ===== Search Input Handler ===== */
        document.getElementById('searchBox').addEventListener('input', function() {
            if (this.value.length > 2) {
                searchMaterials();
            } else if (this.value.length === 0) {
                document.getElementById('searchResults').style.display = 'none';
                document.getElementById('searchResults').classList.remove('active');
                document.getElementById('materialsView').style.display = 'none';
                document.getElementById('materialsView').classList.remove('active');
                document.getElementById('modulesGrid').style.display = 'grid';
            }
        });

        /* ===== Initialize ===== */
        initBackground();
        loadModules();
    </script>
</body>
</html>
