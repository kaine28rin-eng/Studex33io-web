<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#000000" />
  <title>STUDYX — Academic Resource Vault</title>

  <!-- Fonts: Plus Jakarta Sans + JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- GSAP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.10/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.10/ScrollTrigger.min.js"></script>

  <!-- Tailwind Config -->
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            brand: {
              50: '#f5f3ff', 100: '#ede9fe', 200: '#ddd6fe', 300: '#c4b5fd',
              400: '#a78bfa', 500: '#8b5cf6', 600: '#7c3aed', 700: '#6d28d9',
              800: '#5b21b6', 900: '#2e1065',
            }
          },
          animation: {
            'glow-pulse': 'glow 8s ease-in-out infinite',
            'aurora-flow': 'auroraFlow 20s ease-in-out infinite',
            'aurora-flow2': 'auroraFlow2 25s ease-in-out infinite',
            'shimmer': 'shimmer 1.8s infinite',
            'card-enter': 'fadeSlideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards',
          },
          keyframes: {
            glow: {
              '0%, 100%': { transform: 'scale(1) translate(0px, 0px)', opacity: '0.45' },
              '50%': { transform: 'scale(1.2) translate(25px, -15px)', opacity: '0.75' },
            },
            fadeSlideUp: {
              '0%': { opacity: '0', transform: 'translateY(16px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            auroraFlow: {
              '0%, 100%': { backgroundPosition: '0% 50%, 100% 50%, 50% 0%' },
              '25%': { backgroundPosition: '10% 40%, 90% 60%, 60% 10%' },
              '50%': { backgroundPosition: '20% 60%, 80% 40%, 40% 100%' },
              '75%': { backgroundPosition: '10% 50%, 90% 50%, 50% 0%' },
            },
            auroraFlow2: {
              '0%, 100%': { opacity: '0.3', transform: 'scale(1) rotate(0deg)' },
              '50%': { opacity: '0.5', transform: 'scale(1.05) rotate(180deg)' },
            },
            shimmer: {
              '0%': { left: '-100%' },
              '100%': { left: '100%' },
            }
          }
        }
      }
    }
  </script>

  <style>
    /* ===== OLED Blacks & Design Tokens ===== */
    :root {
      --color-bg: #000000;
      --color-bg-deep: #0a0a0f;
      --color-surface: rgba(12, 12, 22, 0.7);
      --color-surface-hover: rgba(20, 20, 35, 0.85);
      --color-border: rgba(255, 255, 255, 0.06);
      --color-border-hover: rgba(255, 255, 255, 0.15);
      --color-primary: #06b6d4;
      --color-primary-hover: #0891b2;
      --color-primary-glow: rgba(6, 182, 212, 0.35);
      --color-text: #f8fafc;
      --color-text-muted: #94a3b8;
      --color-text-dim: #475569;
      --color-green: #10b981;
      --color-amber: #f59e0b;
      --color-accent-cyan: #22d3ee;
      --radius-xl: 20px;
      --radius-lg: 16px;
      --radius-md: 12px;
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --ease-emphasized: cubic-bezier(0.2, 0, 0, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background: var(--color-bg);
      color: var(--color-text);
      overflow-x: hidden;
    }

    /* ===== Ambient Aurora Background ===== */
    .bg-canvas {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      overflow: hidden;
      z-index: 0;
      pointer-events: none;
    }

    .aurora {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at 20% 50%, rgba(6, 182, 212, 0.08) 0%, transparent 50%),
                  radial-gradient(circle at 80% 30%, rgba(139, 92, 246, 0.06) 0%, transparent 50%),
                  radial-gradient(circle at 50% 80%, rgba(16, 185, 129, 0.05) 0%, transparent 50%);
      animation: aurora-flow;
      animation-duration: 20s;
      animation-iteration-count: infinite;
      filter: blur(2px);
    }

    .aurora::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 30% 70%, rgba(224, 39, 145, 0.04) 0%, transparent 60%),
                  radial-gradient(circle at 90% 10%, rgba(245, 158, 11, 0.05) 0%, transparent 50%);
      animation: aurora-flow2;
      animation-duration: 25s;
      animation-iteration-count: infinite;
      filter: blur(1px);
    }

    @keyframes aurora-flow {
      0%, 100% { background-position: 0% 50%, 100% 50%, 50% 0%; }
      25% { background-position: 10% 40%, 90% 60%, 60% 10%; }
      50% { background-position: 20% 60%, 80% 40%, 40% 100%; }
      75% { background-position: 10% 50%, 90% 50%, 50% 0%; }
    }

    @keyframes aurora-flow2 {
      0%, 100% { opacity: 0.3; transform: scale(1) rotate(0deg); }
      50% { opacity: 0.5; transform: scale(1.05) rotate(180deg); }
    }

    .bg-dots {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 32px 32px;
      opacity: 0.3;
    }

    /* ===== Layout ===== */
    .container {
      position: relative;
      z-index: 1;
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 24px;
      min-height: 100vh;
    }

    /* ===== Header ===== */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 32px;
      padding: 12px 0;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 26px;
      font-weight: 800;
      color: var(--color-text);
      text-decoration: none;
      letter-spacing: -0.5px;
    }

    .logo .accent { color: var(--color-primary); }

    .logo-icon {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, var(--color-primary), var(--color-accent-cyan));
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 20px var(--color-primary-glow);
    }

    .subtitle {
      color: var(--color-text-muted);
      font-size: 13px;
      font-weight: 300;
      letter-spacing: 0.3px;
    }

    /* ===== Search Bar — Floating Glass Pill ===== */
    .search-wrapper {
      position: relative;
      margin-bottom: 32px;
    }

    .search-input-wrap {
      position: relative;
      display: flex;
      align-items: center;
      height: 52px;
      background: var(--color-surface);
      border: 1.5px solid var(--color-border);
      border-radius: 999px;
      padding: 0 20px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      transition: all 280ms var(--ease-emphasized);
      overflow: hidden;
    }

    .search-input-wrap:focus-within {
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3px var(--color-primary-glow);
      background: rgba(15, 15, 30, 0.8);
    }

    .search-icon {
      position: absolute;
      left: 18px;
      color: var(--color-text-dim);
      transition: color 120ms ease;
      z-index: 1;
      pointer-events: none;
    }

    .search-input-wrap:focus-within .search-icon {
      color: var(--color-primary);
    }

    .search-input {
      width: 100%;
      height: 100%;
      background: transparent;
      border: none;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 15px;
      color: var(--color-text);
      outline: none;
      font-weight: 400;
    }

    .search-input::placeholder {
      color: var(--color-text-dim);
      font-weight: 400;
    }

    /* ===== Bento Grid ===== */
    .modules-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      margin-bottom: 24px;
    }

    /* Asymmetric Bento spans */
    .bento-span-1 { grid-column: span 1; }
    .bento-span-2 { grid-column: span 2; }

    .module-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-xl);
      padding: 24px;
      cursor: pointer;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      transition: all 180ms var(--ease-emphasized);
      position: relative;
      overflow: hidden;
      opacity: 0;
      transform: translateY(24px) scale(0.97);
    }

    .module-card:hover {
      transform: translateY(-6px) scale(1.02);
      border-color: var(--color-border-hover);
      box-shadow: 0 20px 50px var(--color-primary-glow);
    }

    .module-card::after {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border-radius: var(--radius-xl);
      opacity: 0;
      transition: opacity 180ms ease;
      pointer-events: none;
    }

    .module-card:hover::after {
      opacity: 1;
    }

    .module-icon {
      width: 48px; height: 48px;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, var(--color-primary-glow), var(--color-primary));
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      transition: transform 180ms var(--ease-spring);
    }

    .module-card:hover .module-icon {
      transform: scale(1.12);
    }

    .module-icon svg {
      width: 24px; height: 24px;
      fill: white;
      stroke: white;
      stroke-width: 2;
    }

    .module-name {
      font-size: 18px;
      font-weight: 700;
      color: var(--color-text);
      margin-bottom: 6px;
      letter-spacing: -0.2px;
    }

    .module-desc {
      font-size: 13px;
      color: var(--color-text-muted);
      line-height: 1.5;
      font-weight: 300;
    }

    .module-stats {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 16px;
      font-size: 12px;
      color: var(--color-text-dim);
      font-weight: 500;
    }

    .stat-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--color-text-dim);
    }

    /* ===== Empty State ===== */
    .empty-state {
      text-align: center;
      padding: 56px 20px;
      color: var(--color-text-muted);
      grid-column: 1 / -1;
    }

    .empty-icon {
      width: 64px; height: 64px;
      margin: 0 auto 16px;
      opacity: 0.5;
    }

    .empty-state p {
      font-size: 14px;
      font-weight: 300;
      line-height: 1.6;
    }

    /* ===== Back Button ===== */
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.03);
      color: var(--color-text-muted);
      border: 1.5px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: 8px 20px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 180ms var(--ease-spring);
      backdrop-filter: blur(16px);
      margin-bottom: 24px;
    }

    .back-btn:hover {
      transform: scale(0.97);
      background: var(--color-surface-hover);
      border-color: var(--color-border-hover);
      color: var(--color-text);
    }

    .material-count-badge {
      background: var(--color-primary-glow);
      border: 1px solid var(--color-primary);
      color: var(--color-primary);
      padding: 4px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    /* ===== Materials View ===== */
    .materials-view {
      display: none;
      opacity: 0;
      transform: translateX(-20px) scale(0.98);
    }

    .materials-view.active {
      display: block;
      opacity: 1;
      transform: translateX(0) scale(1);
    }

    .module-header h2 {
      font-size: 24px;
      font-weight: 800;
      color: var(--color-text);
      margin-bottom: 8px;
      letter-spacing: -0.3px;
    }

    .module-header .meta {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--color-text-muted);
      margin-bottom: 24px;
    }

    .materials-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .material-item {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: 18px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      transition: all 220ms var(--ease-emphasized);
      opacity: 0;
      transform: translateY(16px) scale(0.98);
    }

    .material-item:hover {
      transform: scale(1);
      border-color: var(--color-border-hover);
      background: var(--color-surface-hover);
    }

    .material-left {
      display: flex;
      align-items: center;
      gap: 14px;
      flex: 1;
    }

    .file-icon {
      width: 42px; height: 42px;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, var(--color-primary-glow), var(--color-primary));
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .file-icon svg { width: 22px; height: 22px; fill: white; stroke: white; stroke-width: 2; }

    .material-info h4 {
      font-size: 14px;
      font-weight: 600;
      color: var(--color-text);
      margin-bottom: 3px;
      letter-spacing: -0.1px;
    }

    .material-info .meta-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--color-text-dim);
      font-family: 'JetBrains Mono', monospace;
    }

    .material-info .meta-row .dot {
      width: 3px; height: 3px;
      border-radius: 50%;
      background: var(--color-text-dim);
    }

    .download-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--color-primary);
      color: white;
      border: none;
      padding: 9px 22px;
      border-radius: var(--radius-md);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      transition: all 180ms var(--ease-spring);
      flex-shrink: 0;
    }

    .download-btn:hover {
      background: var(--color-primary-hover);
      transform: scale(0.97);
      box-shadow: 0 0 20px var(--color-primary-glow);
    }

    .download-btn:active {
      transform: scale(0.94);
    }

    .footer {
      text-align: center;
      color: var(--color-text-dim);
      font-size: 12px;
      font-family: 'JetBrains Mono', monospace;
      margin-top: 40px;
      padding-top: 20px;
      border-top: 1px solid var(--color-border);
      letter-spacing: 0.5px;
    }

    /* ===== Loading Skeleton ===== */
    .skeleton {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .skeleton-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-xl);
      padding: 24px;
      height: 160px;
      position: relative;
      overflow: hidden;
    }

    .skeleton-card::after {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90, transparent, rgba(255,255,255,0.03), transparent);
      animation: shimmer 1.8s infinite;
    }

    @keyframes shimmer {
      0% { left: -100%; }
      100% { left: 100%; }
    }

    /* ===== Responsive ===== */
    @media (max-width: 768px) {
      .container { padding: 24px 16px; }
      .header { flex-direction: column; gap: 8px; }
      .modules-grid { grid-template-columns: 1fr; }
      .bento-span-2 { grid-column: span 1; }
      .module-card { padding: 20px; }
    }
  </style>
</head>
<body>
  <!-- Ambient Aurora Background -->
  <div class="bg-canvas">
    <div class="aurora"></div>
    <div class="bg-dots"></div>
  </div>

  <div class="container">
    <!-- Header -->
    <div class="header">
      <a href="#" class="logo">
        <span class="logo-icon"><i data-lucide="graduation-cap" class="w-7 h-7 text-white"></i></span>
        <span>STUDY<span class="accent">X</span></span>
      </a>
      <p class="subtitle">Academic Materials Portal — FLSH Mohammedia S5-G2</p>
    </div>

    <!-- Search Bar — Floating Glass Pill -->
    <div class="search-wrapper">
      <div class="search-input-wrap" id="searchWrapper">
        <i data-lucide="search" class="search-icon w-5 h-5"></i>
        <input type="text" id="searchBox" class="search-input" placeholder="Search materials across all modules…" autocomplete="off" />
      </div>
    </div>

    <!-- Modules Grid (Bento) -->
    <div id="modulesGrid" class="modules-grid">
      <div class="skeleton" id="skeletonGrid">
        <div class="skeleton-card"></div>
        <div class="skeleton-card" style="animation-delay: 80ms"></div>
        <div class="skeleton-card" style="animation-delay: 160ms"></div>
        <div class="skeleton-card" style="animation-delay: 240ms"></div>
        <div class="skeleton-card" style="animation-delay: 320ms"></div>
      </div>
    </div>

    <!-- Search Results -->
    <div id="searchResults" class="materials-view">
      <button class="back-btn" onclick="backToModules()">
        <i data-lucide="arrow-left" class="w-4 h-4"></i> Back to Modules
      </button>
      <h2 style="font-size:20px; font-weight:700; color:var(--color-text); margin-bottom:20px;">Search Results</h2>
      <div id="resultsContent"></div>
    </div>

    <!-- Materials View -->
    <div id="materialsView" class="materials-view"></div>

    <!-- Footer -->
    <div class="footer">
      STUDYX Bot • kaine28rin-eng/Studex33io-web
    </div>
  </div>

  <script>
    /* ===== State Management ===== */
    const state = {
      modules: [
        { id: '19th-century-lit', name: '19th Century Literature', desc: '19th Century Russian & British Literature, prose narratives & critical texts', icon: 'book-open', materials: [] },
        { id: 'cultural-studies', name: 'Cultural Studies', desc: 'Cultural theory, identity discourse, film and media studies', icon: 'film', materials: [] },
        { id: 'applied-linguistics', name: 'Applied Linguistics', desc: 'Pedagogical terminology, second language acquisition & phonology', icon: 'languages', materials: [] },
        { id: 'advanced-research', name: 'Advanced Research Techniques', desc: 'Academic methodologies, thesis structure, citations & data sampling', icon: 'microscope', materials: [] },
        { id: 'general-linguistics', name: 'General Linguistics', desc: 'Syntax, semantics, morphology, phonetic structures & language systems', icon: 'binary', materials: [] }
      ],
      currentModuleId: null,
      searchQuery: ''
    };

    /* ===== DOM Elements ===== */
    const modulesContainer = document.getElementById('modulesContainer');
    const mainView = document.getElementById('mainView');
    const detailView = document.getElementById('detailView');
    const backBtn = document.getElementById('backBtn');
    const searchInput = document.getElementById('searchInput');
    const clearSearchBtn = document.getElementById('clearSearchBtn');
    const detailTitle = document.getElementById('detailTitle');
    const detailSubtitle = document.getElementById('detailSubtitle');
    const detailBadge = document.getElementById('detailBadge');
    const detailIconWrapper = document.getElementById('detailIconWrapper');
    const materialsList = document.getElementById('materialsList');

    /* ===== Detect GitHub Pages vs local ===== */
    const IS_GITHUB_PAGES = window.location.hostname.includes('github.io');
    const API_BASE = IS_GITHUB_PAGES ? '' : '/api';

    /* ===== Module Icon Mapping (Lucide) ===== */
    const moduleIcons = {
      '19th Century Literature': 'book-open',
      'Applied Linguistics': 'languages',
      'Cultural Studies': 'film',
      'Introduction to Linguistics': 'search',
      'Introduction to Research': 'atom',
      'Discourse Analysis': 'message-square',
      'French & Translation': 'translate',
      'Advanced Research Techniques': 'microscope',
      'General Linguistics': 'binary'
    };

    /* ===== Format File Size ===== */
    function formatFileSize(bytes) {
      if (!bytes || bytes === 0) return '—';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
    }

    /* ===== Get File Type Icon ===== */
    function getFileTypeIcon(mimeType) {
      if (!mimeType) return 'file';
      if (mimeType.includes('pdf')) return 'file-text';
      if (mimeType.includes('image')) return 'image';
      if (mimeType.includes('video')) return 'video';
      if (mimeType.includes('audio')) return 'music';
      if (mimeType.includes('word') || mimeType.includes('document') || mimeType.includes('text')) return 'file-text';
      if (mimeType.includes('zip') || mimeType.includes('archive')) return 'archive';
      return 'file';
    }

    /* ===== Async Icon HTML ===== */
    function iconHTML(name) {
      return `<i data-lucide="${name}"></i>`;
    }

    /* ===== GSAP Entrance Animation ===== */
    function animateEntrance() {
      const cards = document.querySelectorAll('.module-card');
      if (!cards.length) return;

      gsap.set(cards, { opacity: 0, y: 30, scale: 0.96 });
      gsap.to(cards, {
        opacity: 1,
        y: 0,
        scale: 1,
        duration: 0.7,
        stagger: { amount: 0.6, ease: 'power3.out' },
        ease: 'elastic.out(1, 0.5)',
        delay: 0.2
      });

      const skeleton = document.getElementById('skeletonGrid');
      if (skeleton) {
        gsap.to(skeleton, { opacity: 0, duration: 0.4, ease: 'power2.in' });
      }
    }

    /* ===== Cursor-Following Specular Highlight ===== */
    function initSpecular() {
      const cards = document.querySelectorAll('.module-card');
      cards.forEach(card => {
        card.addEventListener('mousemove', (e) => {
          const rect = card.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const y = e.clientY - rect.top;
          card.style.background = `radial-gradient(circle at ${x}px ${y}px, rgba(255,255,255,0.08) 0%, transparent 70%), var(--color-surface)`;
        });
        card.addEventListener('mouseleave', () => {
          card.style.background = '';
        });
      });
    }

    /* ===== Load Modules ===== */
    async function loadModules() {
      const grid = document.getElementById('modulesGrid');

      try {
        let modules;
        if (IS_GITHUB_PAGES) {
          const resp = await fetch('api/materials.json');
          const data = await resp.json();
          modules = data.modules || [];
        } else {
          const resp = await fetch('/api/modules');
          const data = await resp.json();
          modules = data.modules || [];
        }

        if (modules.length === 0) {
          grid.innerHTML = `
            <div class="empty-state">
              <div class="empty-icon">${iconHTML('inbox')}</div>
              <p>No modules found. Add materials via the Telegram bot.</p>
            </div>
          `;
          lucide.createIcons();
          return;
        }

        // Asymmetric Bento: items at index 1 and 3 span full width
        grid.innerHTML = modules.map((m, i) => {
          const bentoClass = (i === 1 || i === 3) ? 'bento-span-2' : 'bento-span-1';
          const iconName = moduleIcons[m.name] || 'folder';
          const count = m.material_count || 0;
          return `
            <div class="module-card ${bentoClass}" onclick="showModule('${m.name}')">
              <div class="module-icon">${iconHTML(iconName)}</div>
              <h3 class="module-name">${m.name}</h3>
              <p class="module-desc">${m.description || 'No description available.'}</p>
              <div class="module-stats">
                <span class="stat-dot"></span>
                <span>${count} material${count !== 1 ? 's' : ''}</span>
              </div>
            </div>
          `;
        }).join('');

        lucide.createIcons();

        requestAnimationFrame(() => {
          animateEntrance();
          initSpecular();
        });

      } catch (e) {
        grid.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">${iconHTML('alert-circle')}</div>
            <p>Error loading modules. Make sure api/materials.json is accessible.</p>
          </div>
        `;
        lucide.createIcons();
        console.error(e);
      }
    }

    /* ===== Show Module Materials ===== */
    async function showModule(moduleName) {
      const view = document.getElementById('materialsView');
      const grid = document.getElementById('modulesGrid');

      gsap.to(grid, {
        opacity: 0,
        duration: 0.25,
        ease: 'power2.in',
        onComplete: () => {
          grid.style.display = 'none';
        }
      });

      setTimeout(async () => {
        view.innerHTML = `
          <button class="back-btn" onclick="backToModules()">
            <i data-lucide="arrow-left" class="w-4 h-4"></i> Back to Modules
          </button>
          <div class="module-header">
            <h2>${moduleName}</h2>
            <div class="meta" id="moduleMeta">
              <span class="material-count-badge" id="materialCount">0 materials</span>
              <span class="dot"></span>
              <span id="moduleDesc"></span>
            </div>
          </div>
          <div class="materials-list" id="materialsList">
            <div class="material-item" style="opacity:0.5">
              <div style="text-align:center;padding:20px;width:100%;color:var(--color-text-muted)">Loading materials…</div>
            </div>
          </div>
        `;
        view.classList.add('active');
        view.style.display = 'block';
        lucide.createIcons();

        try {
          let materials, moduleInfo;

          if (IS_GITHUB_PAGES) {
            const resp = await fetch('api/materials.json');
            const data = await resp.json();
            materials = (data.materials || []).filter(m => m.module === moduleName);
            moduleInfo = (data.modules || []).find(m => m.name === moduleName) ||
                         { name: moduleName, description: '', material_count: materials.length };
          } else {
            const resp = await fetch(`/api/materials/${encodeURIComponent(moduleName)}`);
            const data = await resp.json();
            materials = data.materials || [];
            moduleInfo = { name: moduleName, description: '', material_count: materials.length };
          }

          document.getElementById('materialCount').textContent =
            `${materials.length} material${materials.length !== 1 ? 's' : ''}`;
          document.getElementById('moduleDesc').textContent = moduleInfo.description || '';

          if (materials.length === 0) {
            document.getElementById('materialsList').innerHTML = `
              <div class="empty-state">
                <div class="empty-icon">${iconHTML('file-text')}</div>
                <p>No materials uploaded yet for this module. Check back later!</p>
              </div>
            `;
          } else {
            let html = '';
            materials.forEach((m, i) => {
              html += `
                <div class="material-item">
                  <div class="material-left">
                    <div class="file-icon">${iconHTML(getFileTypeIcon(m.mime_type))}</div>
                    <div class="material-info">
                      <h4>${m.title}</h4>
                      <div class="meta-row">
                        <span class="dot"></span>
                        <span>${formatFileSize(m.file_size)}</span>
                        <span class="dot"></span>
                        <span>${m.mime_type || 'file'}</span>
                        ${m.uploaded_at ? `<span class="dot"></span><span>${new Date(m.uploaded_at).toLocaleDateString()}</span>` : ''}
                      </div>
                    </div>
                  </div>
                  ${m.download_url ? `<a href="${m.download_url}" class="download-btn">${iconHTML('download')} Download</a>` : ''}
                </div>
              `;
            });
            document.getElementById('materialsList').innerHTML = html;
          }

          lucide.createIcons();

          gsap.to('.material-item', {
            opacity: 1, y: 0, scale: 1,
            duration: 0.5, stagger: 0.08,
            ease: 'power2.out'
          });

        } catch (e) {
          document.getElementById('materialsList').innerHTML =
            `<div class="empty-state"><div class="empty-icon">${iconHTML('alert-circle')}</div><p>Error loading materials.</p></div>`;
          lucide.createIcons();
          console.error(e);
        }
      }, 250);
    }

    /* ===== Back to Modules ===== */
    function backToModules() {
      const view = document.getElementById('materialsView');
      const grid = document.getElementById('modulesGrid');
      const searchResults = document.getElementById('searchResults');

      searchResults.style.display = 'none';
      searchResults.classList.remove('active');

      gsap.to(view, {
        opacity: 0,
        duration: 0.25,
        ease: 'power2.in',
        onComplete: () => {
          view.classList.remove('active');
          view.style.display = 'none';
          view.innerHTML = '';
          grid.style.display = 'grid';
          gsap.to(grid, { opacity: 1, duration: 0.3, ease: 'power2.out' });
        }
      });

      setTimeout(initSpecular, 350);
    }

    /* ===== Search ===== */
    let searchTimeout;
    document.getElementById('searchBox').addEventListener('input', function() {
      const query = this.value.trim();
      if (!query) {
        document.getElementById('searchResults').style.display = 'none';
        document.getElementById('searchResults').classList.remove('active');
        document.getElementById('materialsView').style.display = 'none';
        document.getElementById('materialsView').classList.remove('active');
        document.getElementById('modulesGrid').style.display = 'grid';
        return;
      }
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(searchMaterials, 200);
    });

    async function searchMaterials() {
      const query = document.getElementById('searchBox').value.trim();
      if (!query) return;

      const grid = document.getElementById('modulesGrid');
      const materialsView = document.getElementById('materialsView');
      const searchResults = document.getElementById('searchResults');

      gsap.to(grid, { opacity: 0, duration: 0.25, ease: 'power2.in' });
      materialsView.style.display = 'none';
      materialsView.classList.remove('active');

      setTimeout(async () => {
        grid.style.display = 'none';

        try {
          let results;
          if (IS_GITHUB_PAGES) {
            const resp = await fetch('api/materials.json');
            const data = await resp.json();
            const q = query.toLowerCase();
            results = (data.materials || []).filter(m =>
              (m.title && m.title.toLowerCase().includes(q)) ||
              (m.module && m.module.toLowerCase().includes(q)) ||
              (m.content_text && m.content_text.toLowerCase().includes(q))
            );
          } else {
            const resp = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
            const data = await resp.json();
            results = data.results || [];
          }

          const resultsDiv = document.getElementById('resultsContent');

          if (results.length === 0) {
            resultsDiv.innerHTML = `
              <div class="empty-state">
                <div class="empty-icon">${iconHTML('search-x')}</div>
                <p>No results found for "${query}".</p>
              </div>
            `;
          } else {
            resultsDiv.className = 'materials-list';
            let html = '';
            results.forEach(m => {
              html += `
                <div class="material-item">
                  <div class="material-left">
                    <div class="file-icon">${iconHTML(getFileTypeIcon(m.mime_type))}</div>
                    <div class="material-info">
                      <h4>${m.title}</h4>
                      <div class="meta-row">
                        <span class="dot"></span>
                        <span>${m.module}</span>
                        <span class="dot"></span>
                        <span>${formatFileSize(m.file_size)}</span>
                      </div>
                    </div>
                  </div>
                  ${m.download_url ? `<a href="${m.download_url}" class="download-btn">${iconHTML('download')} Download</a>` : ''}
                </div>
              `;
            });
            resultsDiv.innerHTML = html;
          }

          lucide.createIcons();
          gsap.to('.material-item', {
            opacity: 1, y: 0, scale: 1,
            duration: 0.5, stagger: 0.08,
            ease: 'power2.out'
          });

          searchResults.style.display = 'block';
          searchResults.classList.add('active');

        } catch (e) {
          console.error(e);
        }
      }, 250);
    }

    /* ===== Initialize ===== */
    lucide.createIcons();
    loadModules();
  </script>
</body>
</html>
